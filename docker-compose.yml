# Конфигурация Docker Compose для совместного развертывания Navidrome и poisq
# с общим доступом к базе данных (/data) и папке медиатеки (/music).
services:
  # Официальный музыкальный сервер Navidrome
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    # user: 1000:1000 # Опционально: укажите UID:GID владельца папки с музыкой
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: "15m"
      ND_LOGLEVEL: "info"
      ND_SESSIONTIMEOUT: "24h"
      ND_BASEURL: ""
    volumes:
      - /path/to/your/music:/music:ro # Navidrome читает теги, обложки и .lrc файлы из /music
      - navidrome_data:/data
    ports:
      - "4533:4533"

  # Умный поисковый прокси (:4534) и AI-комбайн для медиатеки (:4535)
  poisq:
    image: ghcr.io/f5go/poisq:latest
    container_name: poisq
    restart: unless-stopped
    depends_on:
      - navidrome
    ports:
      # Публичный порт — только умный поиск и прозрачный Subsonic-прокси (lyrics отдает сам Navidrome)
      - "4534:4534"
      # Внутренний порт веб-админки — доступен только с localhost / SSH-туннеля / VPN
      - "127.0.0.1:4535:4535"
    environment:
      LISTEN_ADDR: ":4534"
      ADMIN_LISTEN_ADDR: ":4535"
      NAVIDROME_URL: "http://navidrome:4533"
      NAVIDROME_DB_PATH: "/data/navidrome.db"
      POISQ_DB_PATH: "/data/poisq.db"
      MUSIC_PATH: "/music"
      SYNC_INTERVAL: "2m"
      ENRICH_SQLITE_FULLTEXT: "true"
      LOG_LEVEL: "info"
      # Studio открывается по IP, localhost, имени без точки или *.local/*.lan; другое имя (например, за обратным прокси) — сюда через запятую
      # ADMIN_HOSTS: "studio.example.com"
      # Точный тайминг караоке через сервис выравнивания (профиль "aligner" ниже).
      # Включите, когда запустите сервис: docker compose --profile aligner up -d
      # ALIGNER_URL: "http://aligner:4540"
      # ALIGNER_TOKEN: "change-me"        # если задан и у сервиса
      # ALIGNER_MUSIC_PATH: "/music"      # только если путь к медиатеке в сервисе другой
    volumes:
      # Общий том данных с Navidrome для доступа к navidrome.db (WAL) и хранения poisq.db
      - navidrome_data:/data
      # Доступ к папке с музыкой для атомарной записи .lrc, cover.jpg и тегов по стандарту Picard (Staging)
      - /path/to/your/music:/music:rw

  # Сервис акустического выравнивания: точное время строк .lrc и уверенность по строкам (см. aligner/README.md).
  # Запускается по профилю: docker compose --profile aligner up -d. Нужны ключ Groq в Studio и ~4 ГБ на модели.
  aligner:
    image: ghcr.io/f5go/poisq-aligner:latest
    container_name: poisq-aligner
    profiles: ["aligner"]
    restart: unless-stopped
    environment:
      MUSIC_ROOT: "/music"
      ALIGNER_THREADS: "6"        # на общем NAS оставьте несколько ядер Navidrome и poisq
      # ALIGNER_TOKEN: "change-me"
    volumes:
      - /path/to/your/music:/music:ro   # тот же путь, что у poisq, только чтение
      - aligner_cache:/cache            # модели, вокальные стемы, результаты

volumes:
  navidrome_data:
  aligner_cache:
